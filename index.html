<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Detis Engine Docs</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="description" content="Detis Engine documentation and guides.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <script>
    (function () {
      var key = 'detis-docs-theme';
      var stored = null;
      try { stored = localStorage.getItem(key); } catch (e) { stored = null; }
      var theme = stored;
      if (theme !== 'light' && theme !== 'dark') {
        var darkMq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
        theme = darkMq && darkMq.matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-docs-theme', theme);
      window.__docsThemeKey = key;
      window.__docsApplyTheme = function (next) {
        document.documentElement.setAttribute('data-docs-theme', next);
        try { localStorage.setItem(key, next); } catch (e) {}
      };
    })();
  </script>
  <link rel="icon" type="image/png" href="images/brand/engine_icon.png">
  <link rel="apple-touch-icon" href="images/brand/apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="docs.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse@1.3.5/dist/sidebar.min.css">
  <style>
    .markdown-section img {
      display: block !important;
      height: auto !important;
      max-width: 600px !important;
      object-fit: contain !important;
      margin: 1em 0 !important;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    (function () {
      var path = location.pathname;
      var pages_base = '/detis_engine_docs/';
      var base_path = '/';
      if (path === '/detis_engine_docs' || path.indexOf('/detis_engine_docs/') === 0)
        base_path = pages_base;

      window.$docsify = {
      name: 'Detis Engine Docs',
      logo: base_path + 'images/brand/engine_icon.png',
      repo: 'detis-softworks/detis_engine_docs',
      basePath: base_path,
      // Resolve markdown links relative to the current page file (reference/sound.md, manuals/audio.md, etc.).
      // Without this, a link like [Sound](sound.md) on reference/README becomes #/sound and 404s on GitHub Pages.
      relativePath: true,
      loadSidebar: true,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      auto2top: true,
      maxLevel: 3,
      subMaxLevel: 3,
      sidebarDisplayLevel: 1,
      search: {
        placeholder: 'Search docs',
        noData: 'No results',
        depth: 3
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true,
        crossChapterText: false
      },
      plugins: [
        function (hook) {
          hook.beforeEach(function (content) {
            return content.replace(/\.\.\/images\//g, base_path + 'images/');
          });
        },
        function (hook) {
          function syncThemeButton(btn) {
            var dark = document.documentElement.getAttribute('data-docs-theme') === 'dark';
            btn.textContent = dark ? 'Light mode' : 'Dark mode';
            btn.setAttribute('aria-pressed', dark ? 'true' : 'false');
          }
          function orderSidebarChrome() {
            var sidebar = document.querySelector('.sidebar');
            if (!sidebar) return;
            var h1 = sidebar.querySelector(':scope > h1');
            var search = sidebar.querySelector(':scope > .search');
            var toggle = sidebar.querySelector('.docs-theme-toggle');
            var nav = sidebar.querySelector('.sidebar-nav');
            if (!h1) return;
            if (search && search.parentNode === sidebar) {
              h1.insertAdjacentElement('afterend', search);
            }
            if (toggle && toggle.parentNode === sidebar) {
              var beforeNav = search || h1;
              beforeNav.insertAdjacentElement('afterend', toggle);
            }
            if (nav && nav.parentNode === sidebar) {
              var last = toggle || search || h1;
              last.insertAdjacentElement('afterend', nav);
            }
          }
          var sidebarChromeReady = false;
          function mountThemeToggle(order) {
            var sidebar = document.querySelector('.sidebar');
            if (!sidebar) return;
            var btn = sidebar.querySelector('.docs-theme-toggle-btn');
            if (!sidebar.querySelector('.docs-theme-toggle')) {
              sidebarChromeReady = false;
              var wrap = document.createElement('div');
              wrap.className = 'docs-theme-toggle';
              btn = document.createElement('button');
              btn.type = 'button';
              btn.className = 'docs-theme-toggle-btn';
              btn.setAttribute('aria-label', 'Toggle light or dark reading theme');
              btn.addEventListener('click', function () {
                var next = document.documentElement.getAttribute('data-docs-theme') === 'dark' ? 'light' : 'dark';
                if (window.__docsApplyTheme) window.__docsApplyTheme(next);
                syncThemeButton(btn);
              });
              wrap.appendChild(btn);
              sidebar.appendChild(wrap);
            }
            if (btn) syncThemeButton(btn);
            if (order || !sidebarChromeReady) {
              orderSidebarChrome();
              sidebarChromeReady = true;
            }
          }
          hook.mounted(function () { mountThemeToggle(true); });
          hook.doneEach(function () {
            var sidebar = document.querySelector('.sidebar');
            if (sidebar && !sidebar.querySelector('.docs-theme-toggle')) {
              mountThemeToggle(true);
            }
          });
        }
      ]
      };
    })();
  </script>
  <script>
    // Live reload for the local preview: serve_docs.ps1 exposes /__stamp
    // (newest source-file timestamp). When it changes under us, reload so
    // markdown/CSS edits show up without a manual refresh. Relative URL,
    // so on GitHub Pages this 404s quietly and does nothing.
    if (location.protocol !== 'file:') {
      var __docsStamp = null;
      fetch('__stamp').then(function (r) { return r.text(); }).then(function (t) { __docsStamp = t; }).catch(function () {});
      setInterval(function () {
        if (__docsStamp === null) return;
        fetch('__stamp', { cache: 'no-store' })
          .then(function (r) { return r.text(); })
          .then(function (t) { if (t && t !== __docsStamp) location.reload(); })
          .catch(function () {});
      }, 1500);
    }
  </script>
  <script>
    // Docsify fetches every .md over XMLHttpRequest, which browsers block on file://.
    // Show instructions instead of a silently empty site when index.html is opened from disk.
    if (location.protocol === 'file:') {
      var box = document.createElement('div');
      box.style.cssText = 'max-width:640px;margin:4em auto;padding:1.5em;border:1px solid #ddd;border-radius:8px;font-family:system-ui,sans-serif;line-height:1.6;';
      box.innerHTML =
        '<h2 style="margin-top:0">The docs need a local web server</h2>' +
        '<p>This page was opened straight from disk (file://). Browsers block Docsify from loading the .md files that way, so no page can load. The documentation itself is fine.</p>' +
        '<p>To preview the site, double-click <code>preview_docs.bat</code> in this folder (or run any static file server here), then browse the address it opens, for example <code>http://localhost:8000/</code>.</p>';
      var app = document.getElementById('app');
      if (app) { app.innerHTML = ''; app.appendChild(box); }
    } else {
      // document.write during parsing keeps the original order: Docsify and the search
      // plugin must both execute while the document is still loading.
      document.write('<script src="https://cdn.jsdelivr.net/npm/docsify@4"><\/script>');
      document.write('<script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"><\/script>');
      document.write('<script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@3/dist/docsify-copy-code.min.js"><\/script>');
      document.write('<script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2.10.1/dist/docsify-pagination.min.js"><\/script>');
      document.write('<script src="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse@1.3.5/dist/docsify-sidebar-collapse.min.js"><\/script>');
      document.write('<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-lua.min.js"><\/script>');
    }
  </script>
</body>
</html>

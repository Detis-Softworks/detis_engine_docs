<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Detis Engine Docs</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="description" content="Detis Engine documentation and guides.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    .markdown-section img {
      display: block !important;
      height: auto !important;
      max-width: 600px !important;
      object-fit: contain !important;
      margin: 1em 0 !important;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    (function () {
      var path = location.pathname;
      var pages_base = '/detis_engine_docs/';
      var base_path = '/';
      if (path === '/detis_engine_docs' || path.indexOf('/detis_engine_docs/') === 0)
        base_path = pages_base;

      window.$docsify = {
      name: 'Detis Engine Docs',
      repo: 'detis-softworks/detis_engine_docs',
      basePath: base_path,
      loadSidebar: true,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      auto2top: true,
      maxLevel: 3,
      subMaxLevel: 2,
      search: {
        placeholder: 'Search docs',
        noData: 'No results',
        depth: 3
      }
      };
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
